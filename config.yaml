  # 时间频率：'h' 表示小时
  insured_date: "auto"   # "auto" = 当天日期，或写 "2026-06-04" 固定日期
  insured_time: "0"
  freq: "h"
  prediction_window: 1056
  
  # 训练/验证/测试划分点（格式：YYYY-MM-DD）

# 对比Montel模型
Montel: 
  model_name: "Montel"
  predict_path: "rawData/SE2_Price_Spot_EUR_MWh_H_Forecast/forecast_issued_00_prefix_latest_fix.csv"
  compare_plot_k: 3
# 训练配置
training:
  devices: "7"          # 设备数量（1=单卡）。配合 CUDA_VISIBLE_DEVICES=7 指定具体 GPU
  seed: 42             # 固定随机种子；注释掉该行则不固定
  loss: "huber"
  learning_rate: 0.001
  scaler_type: "robust" # robust\standard

# 模型名
model_name: "LightGBM"
# model_name: "NHITS"
# 数据配置
data:
  # 目标列名
  target_col: "price_SE2"
  raw_col:
    - "date"
    - "value"

  # 文件字典：列名 -> 文件路径
  files:
    price_SE2: 'rawData/SE2_Price_Spot_EUR_MWh_NordPool_15min_Actual/actual_min_to_H_true_latest.csv'

    # price_SE1: 'rawData/SE1_Price_Spot_EUR_MWh_NordPool_15min_Actual/actual_min_to_H_true_latest.csv'
